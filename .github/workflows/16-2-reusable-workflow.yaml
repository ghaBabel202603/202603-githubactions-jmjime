name: "16 - 2 - Reusable Workflows"

on:
  workflow_dispatch:

jobs:
  deploy:
    # Reusable workflow en OTRO repo: sustituye OWNER y REPO por tu org/usuario y nombre del repo
    # uses: OWNER/REPO/.github/workflows/16-1-reusable-workflow.yaml@main
    # Ejemplo: uses: mi-org/mi-repo-workflows/.github/workflows/16-1-reusable-workflow.yaml@main
    uses: jmjime/WebCECC/.github/workflows/16-1-reusable-worklow.yml@main
    with:
      target-directory: "15-artifacts/react-app"

  print-outputs:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Print outputs
        run: |
          echo "Build status: [${{ needs.deploy.outputs.build-status }}]"
          echo "URL: [${{ needs.deploy.outputs.url }}]"
